<html lang="fr" class="antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rami Scorekeeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Light mode */
        .light {
            background: #f4f4f5 !important;
            color: #18181b !important;
        }

        .light .bg-zinc-950 {
            background: #f4f4f5 !important;
        }

        .light .bg-zinc-900,
        .light .bg-zinc-900\/50,
        .light .bg-zinc-900\/80,
        .light .bg-zinc-800,
        .light .bg-zinc-800\/50 {
            background: #e4e4e7 !important;
        }

        .light .text-zinc-200,
        .light .text-zinc-300,
        .light .text-white {
            color: #18181b !important;
        }

        .light .text-zinc-400,
        .light .text-zinc-500 {
            color: #52525b !important;
        }

        .light .text-zinc-600,
        .light .text-zinc-700 {
            color: #71717a !important;
        }

        .light .border-white\/5,
        .light .border-white\/10,
        .light .border-zinc-800 {
            border-color: rgba(0, 0, 0, 0.1) !important;
        }

        .light .bg-white {
            background: #18181b !important;
            color: #fff !important;
        }

        .light .bg-white\/5,
        .light .bg-white\/10 {
            background: rgba(0, 0, 0, 0.05) !important;
        }

        .light .placeholder-zinc-700::placeholder {
            color: #a1a1aa !important;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-content {
            background: #18181b;
            border-radius: 12px;
            max-width: 90%;
            max-height: 80vh;
            overflow: auto;
        }

        .light .modal-content {
            background: #fff;
        }
    </style>
</head>

<body class="bg-zinc-950 text-zinc-200 min-h-screen flex flex-col selection:bg-white/20 selection:text-white">
    <div id="app" class="flex-grow flex flex-col max-w-2xl mx-auto w-full p-4 md:p-6 relative"></div>

    <script>
        let darkMode = localStorage.getItem('rami_dark') !== 'false';
        if (!darkMode) document.body.classList.add('light');

        const initialState = {
            screen: 'home',
            mode: 'individual',
            players: [],
            teams: {
                team1: { players: [{ id: 1, name: '' }, { id: 2, name: '' }], score: 0, history: [] },
                team2: { players: [{ id: 3, name: '' }, { id: 4, name: '' }], score: 0, history: [] }
            },
            maxScore: 1000,
            round: 1,
            dealerIndex: 0,
            distributionOrder: [],
            gameStartTime: null,
            roundStartTime: null,
            roundHistory: [],
            timerInterval: null,
            elapsedGame: 0,
            elapsedRound: 0,
            previousRoundScores: null
        };

        let state = JSON.parse(localStorage.getItem('rami_state')) || JSON.parse(JSON.stringify(initialState));

        function saveState() { localStorage.setItem('rami_state', JSON.stringify(state)); }
        function resetState() { state = JSON.parse(JSON.stringify(initialState)); saveState(); render(); }
        function formatTime(seconds) { const m = Math.floor(seconds / 60); const s = seconds % 60; return `${m}:${s.toString().padStart(2, '0')}`; }

        function toggleTheme() {
            darkMode = !darkMode;
            localStorage.setItem('rami_dark', darkMode);
            document.body.classList.toggle('light', !darkMode);
            render();
        }

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.roundStartTime = Date.now() - (state.elapsedRound * 1000);
            if (!state.gameStartTime) state.gameStartTime = Date.now() - (state.elapsedGame * 1000);
            state.timerInterval = setInterval(() => {
                const now = Date.now();
                state.elapsedRound = Math.floor((now - state.roundStartTime) / 1000);
                state.elapsedGame = Math.floor((now - state.gameStartTime) / 1000);
                const roundEl = document.getElementById('timer-round');
                const gameEl = document.getElementById('timer-game');
                if (roundEl) roundEl.innerText = formatTime(state.elapsedRound);
                if (gameEl) gameEl.innerText = formatTime(state.elapsedGame);
            }, 1000);
        }

        function stopTimer() { if (state.timerInterval) clearInterval(state.timerInterval); }
        function getDealerName() { return state.distributionOrder.length ? state.distributionOrder[state.dealerIndex].name : ''; }
        function getTeamName(team) { const names = team.players.filter(p => p.name.trim()).map(p => p.name); return names.length > 0 ? names.join(' et ') : 'Équipe'; }

        function updateDistributionPreview() {
            const el = document.getElementById('distribution-preview');
            if (!el) return;
            let html = '';
            if (state.teams.team1.players[0].name) html += `<span class="px-2 py-1 bg-indigo-500/20 text-indigo-300 text-xs rounded">1. ${state.teams.team1.players[0].name}</span>`;
            if (state.teams.team2.players[0].name) html += `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-300 text-xs rounded">2. ${state.teams.team2.players[0].name}</span>`;
            if (state.teams.team1.players[1].name) html += `<span class="px-2 py-1 bg-indigo-500/20 text-indigo-300 text-xs rounded">3. ${state.teams.team1.players[1].name}</span>`;
            if (state.teams.team2.players[1].name) html += `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-300 text-xs rounded">4. ${state.teams.team2.players[1].name}</span>`;
            el.innerHTML = html;
        }

        function setupGame() {
            state.screen = 'setup';
            state.players = [{ id: 1, name: '', score: 0, history: [] }, { id: 2, name: '', score: 0, history: [] }];
            state.teams = {
                team1: { players: [{ id: 1, name: '' }, { id: 2, name: '' }], score: 0, history: [] },
                team2: { players: [{ id: 3, name: '' }, { id: 4, name: '' }], score: 0, history: [] }
            };
            render();
        }

        function quickAddTeam(name) {
            const t = state.teams;
            if (!t.team1.players[0].name) t.team1.players[0].name = name;
            else if (!t.team1.players[1].name) t.team1.players[1].name = name;
            else if (!t.team2.players[0].name) t.team2.players[0].name = name;
            else if (!t.team2.players[1].name) t.team2.players[1].name = name;
            render();
        }

        function quickAddIndiv(name) {
            const empty = state.players.findIndex(p => !p.name.trim());
            if (empty >= 0) state.players[empty].name = name;
            else state.players.push({ id: Date.now(), name, score: 0, history: [] });
            render();
        }

        function startGame() {
            if (state.mode === 'teams') {
                const t1Valid = state.teams.team1.players.every(p => p.name.trim() !== '');
                const t2Valid = state.teams.team2.players.every(p => p.name.trim() !== '');
                if (!t1Valid || !t2Valid) { alert("Tous les joueurs doivent avoir un nom."); return; }
                state.distributionOrder = [];
                for (let i = 0; i < 2; i++) {
                    state.distributionOrder.push({ ...state.teams.team1.players[i], team: 1 });
                    state.distributionOrder.push({ ...state.teams.team2.players[i], team: 2 });
                }
                state.teams.team1.score = 0; state.teams.team1.history = [];
                state.teams.team2.score = 0; state.teams.team2.history = [];
            } else {
                const validPlayers = state.players.filter(p => p.name.trim() !== '');
                if (validPlayers.length < 2) { alert("Il faut au moins 2 joueurs."); return; }
                state.players = validPlayers;
                state.distributionOrder = validPlayers;
            }
            state.screen = 'game';
            state.round = 1; state.dealerIndex = 0; state.roundHistory = [];
            state.gameStartTime = Date.now();
            state.roundStartTime = Date.now();
            state.elapsedGame = 0; state.elapsedRound = 0;
            startTimer(); saveState(); render();
        }

        function openScoreInput() { state.screen = 'input'; saveState(); render(); }

        function validateRound(scores) {
            if (state.mode === 'teams') {
                state.previousRoundScores = { team1: { ...state.teams.team1, history: [...state.teams.team1.history] }, team2: { ...state.teams.team2, history: [...state.teams.team2.history] } };
                state.roundHistory.push({ round: state.round, duration: state.elapsedRound });
                const s1 = parseInt(scores[0]) || 0, s2 = parseInt(scores[1]) || 0;
                state.teams.team1.score += s1; state.teams.team1.history.push(s1);
                state.teams.team2.score += s2; state.teams.team2.history.push(s2);
                if (state.teams.team1.score >= state.maxScore || state.teams.team2.score >= state.maxScore) {
                    state.screen = 'end'; stopTimer();
                } else {
                    state.round++; state.dealerIndex = (state.dealerIndex + 1) % 4;
                    state.elapsedRound = 0; state.roundStartTime = Date.now(); state.screen = 'game';
                }
            } else {
                state.previousRoundScores = state.players.map(p => ({ ...p, history: [...p.history] }));
                state.roundHistory.push({ round: state.round, duration: state.elapsedRound });
                let maxReached = false;
                state.players.forEach((p, i) => { const pts = parseInt(scores[i]) || 0; p.score += pts; p.history.push(pts); if (p.score >= state.maxScore) maxReached = true; });
                if (maxReached) { state.screen = 'end'; stopTimer(); }
                else { state.round++; state.dealerIndex = (state.dealerIndex + 1) % state.players.length; state.elapsedRound = 0; state.roundStartTime = Date.now(); state.screen = 'game'; }
            }
            saveState(); render();
        }

        function undoLastRound() {
            if (!state.previousRoundScores) return;
            if (state.mode === 'teams') { state.teams.team1 = state.previousRoundScores.team1; state.teams.team2 = state.previousRoundScores.team2; }
            else { state.players = state.previousRoundScores; }
            state.round--; state.dealerIndex = (state.dealerIndex - 1 + state.distributionOrder.length) % state.distributionOrder.length;
            state.roundHistory.pop(); state.previousRoundScores = null; state.screen = 'game'; saveState(); render();
        }

        function rematch() {
            if (state.mode === 'teams') { state.teams.team1.score = 0; state.teams.team1.history = []; state.teams.team2.score = 0; state.teams.team2.history = []; }
            else { state.players = state.players.map(p => ({ ...p, score: 0, history: [] })); }
            state.round = 1; state.dealerIndex = 0; state.roundHistory = []; state.previousRoundScores = null;
            state.screen = 'game'; state.gameStartTime = Date.now(); state.roundStartTime = Date.now();
            state.elapsedGame = 0; state.elapsedRound = 0; startTimer(); saveState(); render();
        }

        function showHistory(fromScreen) {
            state.historyFrom = fromScreen || state.screen;
            state.screen = 'history';
            render();
        }

        function backFromHistory() {
            state.screen = state.historyFrom || 'game';
            render();
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            setTimeout(() => lucide.createIcons(), 0);
            if (state.screen === 'home') renderHome(app);
            else if (state.screen === 'setup') renderSetup(app);
            else if (state.screen === 'game') renderGame(app);
            else if (state.screen === 'input') renderInput(app);
            else if (state.screen === 'end') renderEnd(app);
            else if (state.screen === 'history') renderHistory(app);
        }

        function themeToggle() {
            return `<button onclick="toggleTheme()" class="absolute top-4 right-4 p-2 rounded-lg bg-zinc-900/50 border border-white/5 text-zinc-400 hover:text-white"><i data-lucide="${darkMode ? 'sun' : 'moon'}" class="w-4 h-4"></i></button>`;
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-[80vh] fade-in space-y-12">
                    ${themeToggle()}
                    <div class="text-center space-y-2">
                        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-white/10 text-white mb-4">
                            <i data-lucide="spade" class="w-6 h-6" stroke-width="1.5"></i>
                        </div>
                        <h1 class="text-3xl font-medium tracking-tight text-white">Rami Score</h1>
                        <p class="text-zinc-400">Assistant de jeu simple et rapide</p>
                    </div>
                    <div class="flex flex-col w-full max-w-xs space-y-3">
                        <button onclick="setupGame()" class="w-full h-12 bg-white text-black font-medium text-sm rounded-lg hover:bg-zinc-200 transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i> Nouvelle partie
                        </button>
                    </div>
                </div>
            `;
        }

        function renderSetup(container) {
            const defaultPlayers = ['Hacene', 'Salima', 'Ryad', 'Yanis', 'Sofiane','Malika'];
            let html = `
                <div class="fade-in space-y-6 pt-4">
                    ${themeToggle()}
                    <div class="flex items-center justify-between">
                        <button onclick="resetState()" class="p-2 -ml-2 text-zinc-500 hover:text-white transition-colors"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                        <h2 class="text-sm font-medium text-zinc-400 uppercase tracking-wider">Configuration</h2>
                        <div class="w-5"></div>
                    </div>
                    <div class="bg-zinc-900/50 p-1 rounded-lg flex border border-white/5">
                        <button onclick="state.mode='individual'; render()" class="flex-1 py-2 text-sm font-medium rounded-md transition-all ${state.mode === 'individual' ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}">Individuel</button>
                        <button onclick="state.mode='teams'; render()" class="flex-1 py-2 text-sm font-medium rounded-md transition-all ${state.mode === 'teams' ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}">Équipes</button>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-xs font-medium text-zinc-500">Sélection rapide</label>
                        <div class="flex flex-wrap gap-2">
                            ${defaultPlayers.map(n => `<button onclick="${state.mode === 'teams' ? `quickAddTeam('${n}')` : `quickAddIndiv('${n}')`}" class="px-3 py-1.5 text-xs bg-zinc-900 border border-white/10 rounded-lg hover:border-indigo-500/50 text-zinc-300 hover:text-white transition-colors">${n}</button>`).join('')}
                        </div>
                    </div>
                    
                    <div class="space-y-3">`;

            if (state.mode === 'teams') {
                html += `
                    <div class="bg-zinc-900/50 border border-indigo-500/20 rounded-lg p-4 space-y-3">
                        <span class="text-sm font-medium text-indigo-400">Équipe 1</span>
                        <input type="text" placeholder="Joueur 1" value="${state.teams.team1.players[0].name}" oninput="state.teams.team1.players[0].name=this.value;updateDistributionPreview()" class="w-full bg-transparent border-b border-zinc-800 focus:border-indigo-400 outline-none py-2 text-sm placeholder-zinc-700">
                        <input type="text" placeholder="Joueur 2" value="${state.teams.team1.players[1].name}" oninput="state.teams.team1.players[1].name=this.value;updateDistributionPreview()" class="w-full bg-transparent border-b border-zinc-800 focus:border-indigo-400 outline-none py-2 text-sm placeholder-zinc-700">
                    </div>
                    <div class="bg-zinc-900/50 border border-emerald-500/20 rounded-lg p-4 space-y-3">
                        <span class="text-sm font-medium text-emerald-400">Équipe 2</span>
                        <input type="text" placeholder="Joueur 1" value="${state.teams.team2.players[0].name}" oninput="state.teams.team2.players[0].name=this.value;updateDistributionPreview()" class="w-full bg-transparent border-b border-zinc-800 focus:border-emerald-400 outline-none py-2 text-sm placeholder-zinc-700">
                        <input type="text" placeholder="Joueur 2" value="${state.teams.team2.players[1].name}" oninput="state.teams.team2.players[1].name=this.value;updateDistributionPreview()" class="w-full bg-transparent border-b border-zinc-800 focus:border-emerald-400 outline-none py-2 text-sm placeholder-zinc-700">
                    </div>
                    <div class="p-3 bg-zinc-800/50 rounded-lg">
                        <span class="text-xs text-zinc-500 block mb-2">Ordre de distribution :</span>
                        <div id="distribution-preview" class="flex flex-wrap gap-2">
                            ${state.teams.team1.players[0].name ? `<span class="px-2 py-1 bg-indigo-500/20 text-indigo-300 text-xs rounded">1. ${state.teams.team1.players[0].name}</span>` : ''}
                            ${state.teams.team2.players[0].name ? `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-300 text-xs rounded">2. ${state.teams.team2.players[0].name}</span>` : ''}
                            ${state.teams.team1.players[1].name ? `<span class="px-2 py-1 bg-indigo-500/20 text-indigo-300 text-xs rounded">3. ${state.teams.team1.players[1].name}</span>` : ''}
                            ${state.teams.team2.players[1].name ? `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-300 text-xs rounded">4. ${state.teams.team2.players[1].name}</span>` : ''}
                        </div>
                    </div>`;
            } else {
                html += `<label class="text-xs font-medium text-zinc-500 ml-1">Joueurs (Ordre de jeu)</label><div id="players-list" class="space-y-2">`;
                state.players.forEach((p, idx) => {
                    html += `<div class="flex gap-2">
                        <div class="flex items-center justify-center w-8 text-xs text-zinc-600 font-mono">${idx + 1}</div>
                        <input type="text" placeholder="Prénom" value="${p.name}" oninput="state.players[${idx}].name = this.value" class="flex-1 bg-transparent border-b border-zinc-800 focus:border-white outline-none py-2 text-sm placeholder-zinc-700 transition-colors">
                        ${idx > 1 ? `<button onclick="state.players.splice(${idx},1); render()" class="text-zinc-700 hover:text-red-400 p-2"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
                    </div>`;
                });
                html += `</div><button onclick="state.players.push({id: Date.now(), name: '', score: 0, history: []}); render()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium py-2 flex items-center gap-1 ml-8"><i data-lucide="plus" class="w-3 h-3"></i> Ajouter un joueur</button>`;
            }

            html += `</div>
                    <div class="space-y-3">
                        <label class="text-xs font-medium text-zinc-500 ml-1">Score Maximum</label>
                        <div class="flex items-center gap-3">
                            <button onclick="state.maxScore = 1001; render()" class="px-4 py-2 rounded border ${state.maxScore === 1001 ? 'bg-white text-black border-white' : 'border-zinc-800 text-zinc-500'} text-xs font-medium">1001</button>
                            <button onclick="state.maxScore = 1501; render()" class="px-4 py-2 rounded border ${state.maxScore === 1501 ? 'bg-white text-black border-white' : 'border-zinc-800 text-zinc-500'} text-xs font-medium">1501</button>
                            <button onclick="state.maxScore = 2001; render()" class="px-4 py-2 rounded border ${state.maxScore === 2001 ? 'bg-white text-black border-white' : 'border-zinc-800 text-zinc-500'} text-xs font-medium">2001</button>
                        </div>
                    </div>
                    <div class="pt-6">
                        <button onclick="startGame()" class="w-full h-12 bg-white text-black font-medium text-sm rounded-lg hover:bg-zinc-200 transition-colors shadow-[0_0_15px_rgba(255,255,255,0.1)]">Lancer la partie</button>
                    </div>
                </div>`;
            container.innerHTML = html;
        }

        function renderGame(container) {
            const dealer = getDealerName();
            let scoresHtml = '';
            let historyHtml = '';

            if (state.mode === 'teams') {
                const team1Name = getTeamName(state.teams.team1);
                const team2Name = getTeamName(state.teams.team2);
                scoresHtml = `
                    <div class="bg-zinc-900/80 border border-indigo-500/20 p-4 rounded-lg">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm text-indigo-300 font-medium">${team1Name}</span>
                            <span class="font-bold text-2xl ${state.teams.team1.score >= state.maxScore ? 'text-red-500' : 'text-white'}">${state.teams.team1.score}</span>
                        </div>
                        <div class="text-xs text-zinc-500">Dernier tour: +${state.teams.team1.history.length > 0 ? state.teams.team1.history[state.teams.team1.history.length - 1] : '0'}</div>
                    </div>
                    <div class="bg-zinc-900/80 border border-emerald-500/20 p-4 rounded-lg">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm text-emerald-300 font-medium">${team2Name}</span>
                            <span class="font-bold text-2xl ${state.teams.team2.score >= state.maxScore ? 'text-red-500' : 'text-white'}">${state.teams.team2.score}</span>
                        </div>
                        <div class="text-xs text-zinc-500">Dernier tour: +${state.teams.team2.history.length > 0 ? state.teams.team2.history[state.teams.team2.history.length - 1] : '0'}</div>
                    </div>`;
            } else {
                scoresHtml = state.players.map(p => {
                    const isDealer = p.name === dealer;
                    return `<div class="bg-zinc-900/80 border ${isDealer ? 'border-indigo-500/30' : 'border-white/5'} p-3 rounded-lg flex justify-between items-center">
                        <div class="flex flex-col overflow-hidden mr-2">
                            <span class="text-xs text-zinc-400 truncate ${isDealer ? 'text-indigo-300' : ''}">${p.name}</span>
                            <span class="text-xs text-zinc-600 font-mono">+${p.history.length > 0 ? p.history[p.history.length - 1] : '0'}</span>
                        </div>
                        <span class="font-medium text-lg ${p.score >= state.maxScore ? 'text-red-500' : 'text-white'}">${p.score}</span>
                    </div>`;
                }).join('');
            }

            container.innerHTML = `
                <div class="h-full flex flex-col fade-in">
                    ${themeToggle()}
                    <div class="flex items-center justify-center py-4">
                        <span class="text-sm font-medium text-indigo-400 uppercase tracking-wider">Tour ${state.round}</span>
                    </div>
                    <div class="flex-grow flex flex-col items-center justify-center py-8 space-y-2">
                        <div class="text-zinc-500 text-xs uppercase tracking-widest font-medium">Donneur</div>
                        <div class="text-4xl md:text-5xl font-medium text-white tracking-tight text-center break-words max-w-full">${dealer}</div>
                        <div class="h-px w-12 bg-zinc-800 mt-4"></div>
                    </div>
                    <div class="grid grid-cols-${state.mode === 'teams' ? '1' : '2'} gap-3 mb-6">${scoresHtml}</div>
                    <div class="mt-auto space-y-3 pb-4">
                        <button onclick="openScoreInput()" class="w-full h-14 bg-white text-black font-semibold text-base rounded-lg shadow-[0_0_20px_rgba(255,255,255,0.15)] hover:bg-zinc-200 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="pen-tool" class="w-5 h-5"></i> Saisir les scores
                        </button>
                        <div class="flex gap-2">
                            ${state.round > 1 ? `<button onclick="showHistory()" class="flex-1 py-3 text-xs bg-zinc-900 border border-white/5 rounded-lg text-zinc-400 hover:text-white flex items-center justify-center gap-2"><i data-lucide="list" class="w-3 h-3"></i> Historique</button>` : ''}
                            ${state.previousRoundScores ? `<button onclick="undoLastRound()" class="flex-1 py-3 text-xs bg-zinc-900 border border-white/5 rounded-lg text-zinc-400 hover:text-white flex items-center justify-center gap-2"><i data-lucide="rotate-ccw" class="w-3 h-3"></i> Annuler</button>` : ''}
                        </div>
                        <button onclick="if(confirm('Abandonner la partie en cours ?')) resetState()" class="w-full py-2 text-xs text-zinc-600 hover:text-red-400 flex items-center justify-center gap-2">
                            <i data-lucide="home" class="w-3 h-3"></i> Nouvelle partie
                        </button>
                    </div>
                </div>
            `;
        }

        function renderInput(container) {
            let inputsHtml = '';
            if (state.mode === 'teams') {
                const team1Name = getTeamName(state.teams.team1);
                const team2Name = getTeamName(state.teams.team2);
                inputsHtml = `
                    <div class="py-4 border-b border-white/5">
                        <span class="text-base font-medium text-indigo-300 block mb-2">${team1Name}</span>
                        <input type="number" id="score-0" placeholder="0" class="w-full bg-zinc-900 border border-indigo-500/30 rounded-md py-3 px-4 text-center text-lg font-medium text-white focus:border-indigo-500 outline-none">
                    </div>
                    <div class="py-4 border-b border-white/5">
                        <span class="text-base font-medium text-emerald-300 block mb-2">${team2Name}</span>
                        <input type="number" id="score-1" placeholder="0" class="w-full bg-zinc-900 border border-emerald-500/30 rounded-md py-3 px-4 text-center text-lg font-medium text-white focus:border-emerald-500 outline-none">
                    </div>`;
            } else {
                inputsHtml = state.players.map((p, idx) => `
                    <div class="flex items-center justify-between py-4 border-b border-white/5">
                        <span class="text-base font-medium text-zinc-200 w-1/3 truncate">${p.name}</span>
                        <input type="number" id="score-${idx}" placeholder="0" class="w-24 bg-zinc-900 border border-white/10 rounded-md py-3 px-2 text-center text-lg font-medium text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                `).join('');
            }

            container.innerHTML = `
                <div class="flex flex-col h-full fade-in">
                    ${themeToggle()}
                    <div class="flex items-center justify-between py-4 mb-4">
                        <button onclick="state.screen='game'; render()" class="text-zinc-400 hover:text-white flex items-center gap-1 text-sm">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i> Retour
                        </button>
                        <h2 class="text-sm font-medium text-white">Fin du Tour ${state.round}</h2>
                        <div class="w-10"></div>
                    </div>
                    <div class="flex-grow overflow-y-auto">${inputsHtml}</div>
                    <div class="py-6 mt-auto space-y-3">
                        <button onclick="submitScores()" class="w-full h-12 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-indigo-900/20">
                            Valider et tour suivant <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                        <button onclick="if(confirm('Abandonner la partie en cours ?')) resetState()" class="w-full py-2 text-xs text-zinc-600 hover:text-red-400 flex items-center justify-center gap-2">
                            <i data-lucide="home" class="w-3 h-3"></i> Nouvelle partie
                        </button>
                    </div>
                </div>
            `;
            setTimeout(() => document.getElementById('score-0').focus(), 100);
        }

        function submitScores() {
            if (state.mode === 'teams') validateRound([document.getElementById('score-0').value, document.getElementById('score-1').value]);
            else validateRound(state.players.map((_, idx) => document.getElementById(`score-${idx}`).value));
        }

        function renderEnd(container) {
            let winnerHtml = '', rankingHtml = '';
            if (state.mode === 'teams') {
                const team1Name = getTeamName(state.teams.team1);
                const team2Name = getTeamName(state.teams.team2);
                const winner = state.teams.team1.score < state.teams.team2.score ? { name: team1Name, score: state.teams.team1.score } : { name: team2Name, score: state.teams.team2.score };
                const loser = state.teams.team1.score < state.teams.team2.score ? { name: team2Name, score: state.teams.team2.score } : { name: team1Name, score: state.teams.team1.score };
                winnerHtml = `<h1 class="text-3xl font-medium tracking-tight text-white">${winner.name}</h1><p class="text-zinc-500 text-sm font-mono mt-2">${winner.score} pts</p>`;
                rankingHtml = `<div class="px-4 py-3 flex justify-between items-center border-b border-white/5"><div class="flex items-center gap-3"><span class="text-xs font-mono text-zinc-600 w-4">1</span><span class="text-sm font-medium text-white">${winner.name}</span></div><span class="text-sm font-mono text-zinc-400">${winner.score}</span></div>
                    <div class="px-4 py-3 flex justify-between items-center"><div class="flex items-center gap-3"><span class="text-xs font-mono text-zinc-600 w-4">2</span><span class="text-sm text-zinc-300">${loser.name}</span></div><span class="text-sm font-mono text-red-400">${loser.score}</span></div>`;
            } else {
                const sorted = [...state.players].sort((a, b) => a.score - b.score);
                const winner = sorted[0];
                winnerHtml = `<h1 class="text-4xl font-medium tracking-tight text-white">${winner.name}</h1><p class="text-zinc-500 text-sm font-mono mt-2">${winner.score} pts</p>`;
                rankingHtml = sorted.map((p, i) => `<div class="px-4 py-3 flex justify-between items-center ${i !== sorted.length - 1 ? 'border-b border-white/5' : ''}"><div class="flex items-center gap-3"><span class="text-xs font-mono text-zinc-600 w-4">${i + 1}</span><span class="text-sm text-zinc-300 ${p.id === winner.id ? 'font-medium text-white' : ''}">${p.name}</span></div><span class="text-sm font-mono ${p.score >= state.maxScore ? 'text-red-400' : 'text-zinc-400'}">${p.score}</span></div>`).join('');
            }
            const avgTime = Math.floor(state.elapsedGame / state.round);

            container.innerHTML = `
                <div class="flex flex-col h-full fade-in py-8">
                    ${themeToggle()}
                    <div class="text-center space-y-2 mb-10">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-yellow-500/10 text-yellow-500 mb-4 border border-yellow-500/20 shadow-[0_0_30px_rgba(234,179,8,0.2)]">
                            <i data-lucide="trophy" class="w-8 h-8" stroke-width="1.5"></i>
                        </div>
                        <h2 class="text-sm font-medium text-zinc-400 uppercase tracking-widest">Vainqueur</h2>
                        ${winnerHtml}
                    </div>
                    <div class="space-y-6">
                        <div class="bg-zinc-900 border border-white/5 rounded-xl overflow-hidden">
                            <div class="bg-white/5 px-4 py-2 text-xs font-medium text-zinc-400 border-b border-white/5 flex justify-between"><span>Classement</span><span>Points</span></div>
                            ${rankingHtml}
                        </div>
                        <button onclick="showHistory()" class="w-full py-3 text-xs bg-zinc-900 border border-white/5 rounded-lg text-zinc-400 hover:text-white flex items-center justify-center gap-2"><i data-lucide="list" class="w-3 h-3"></i> Voir le détail des tours</button>
                    </div>
                    <div class="mt-auto space-y-3 pt-8">
                        <button onclick="rematch()" class="w-full h-12 bg-white text-black font-medium text-sm rounded-lg hover:bg-zinc-200 transition-colors">Revanche</button>
                        <button onclick="resetState()" class="w-full h-12 bg-transparent text-zinc-400 border border-white/10 font-medium text-sm rounded-lg hover:bg-white/5 transition-colors">Nouvelle Partie</button>
                    </div>
                </div>
            `;
        }

        function renderHistory(container) {
            let tableHtml = '';

            if (state.mode === 'teams') {
                const team1Name = getTeamName(state.teams.team1);
                const team2Name = getTeamName(state.teams.team2);

                tableHtml = `
                    <div class="bg-zinc-900 border border-white/5 rounded-xl overflow-hidden">
                        <div class="grid grid-cols-3 gap-0 bg-white/5 border-b border-white/5">
                            <div class="p-3 text-xs font-medium text-zinc-500">Tour</div>
                            <div class="p-3 text-xs font-medium text-indigo-400">${team1Name}</div>
                            <div class="p-3 text-xs font-medium text-emerald-400">${team2Name}</div>
                        </div>
                        ${state.teams.team1.history.map((h, i) => {
                    return `<div class="grid grid-cols-3 gap-0 border-b border-white/5">
                                <div class="p-3 text-sm text-zinc-500 font-mono">${i + 1}</div>
                                <div class="p-3 text-sm text-indigo-300 font-medium">+${h}</div>
                                <div class="p-3 text-sm text-emerald-300 font-medium">+${state.teams.team2.history[i]}</div>
                            </div>`;
                }).join('')}
                        <div class="grid grid-cols-3 gap-0 bg-white/5">
                            <div class="p-3 text-xs font-medium text-zinc-400">Total</div>
                            <div class="p-3 text-sm font-bold text-white">${state.teams.team1.score}</div>
                            <div class="p-3 text-sm font-bold text-white">${state.teams.team2.score}</div>
                        </div>
                    </div>`;
            } else {
                const numPlayers = state.players.length;
                const numRounds = state.round - 1;

                tableHtml = `
                    <div class="bg-zinc-900 border border-white/5 rounded-xl overflow-hidden overflow-x-auto">
                        <div class="min-w-max">
                            <div class="grid gap-0 bg-white/5 border-b border-white/5" style="grid-template-columns: 60px repeat(${numPlayers}, minmax(80px, 1fr))">
                                <div class="p-3 text-xs font-medium text-zinc-500">Tour</div>
                                ${state.players.map(p => `<div class="p-3 text-xs font-medium text-zinc-300 truncate">${p.name}</div>`).join('')}
                            </div>
                            ${Array.from({ length: numRounds }, (_, i) => {
                    return `<div class="grid gap-0 border-b border-white/5" style="grid-template-columns: 60px repeat(${numPlayers}, minmax(80px, 1fr))">
                                    <div class="p-3 text-sm text-zinc-500 font-mono">${i + 1}</div>
                                    ${state.players.map(p => {
                        const pts = p.history[i] || 0;
                        return `<div class="p-3 text-sm text-indigo-300 font-medium">+${pts}</div>`;
                    }).join('')}
                                </div>`;
                }).join('')}
                            <div class="grid gap-0 bg-white/5" style="grid-template-columns: 60px repeat(${numPlayers}, minmax(80px, 1fr))">
                                <div class="p-3 text-xs font-medium text-zinc-400">Total</div>
                                ${state.players.map(p => `<div class="p-3 text-sm font-bold ${p.score >= state.maxScore ? 'text-red-400' : 'text-white'}">${p.score}</div>`).join('')}
                            </div>
                        </div>
                    </div>`;
            }

            container.innerHTML = `
                <div class="flex flex-col h-full fade-in">
                    ${themeToggle()}
                    <div class="flex items-center justify-between py-4 mb-4">
                        <button onclick="backFromHistory()" class="text-zinc-400 hover:text-white flex items-center gap-1 text-sm">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i> Retour
                        </button>
                        <h2 class="text-sm font-medium text-white">Historique des tours</h2>
                        <div class="w-16"></div>
                    </div>
                    
                    <div class="mb-6">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-full bg-indigo-500/20 flex items-center justify-center">
                                <i data-lucide="list" class="w-5 h-5 text-indigo-400"></i>
                            </div>
                            <div>
                                <div class="text-white font-medium">${state.round - 1} tours joués</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex-grow overflow-y-auto">
                        ${tableHtml}
                    </div>
                    
                    <div class="py-4 mt-4">
                        <button onclick="backFromHistory()" class="w-full h-12 bg-zinc-900 border border-white/10 text-white font-medium text-sm rounded-lg hover:bg-zinc-800 transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> Retour à la partie
                        </button>
                    </div>
                </div>
            `;
        }

        if (state.screen === 'game') startTimer();
        render();
    </script>
</body>

</html>
